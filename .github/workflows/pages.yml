# Static demo on GitHub Pages.
#
# GitHub Pages serves files, not processes, so this workflow builds the static
# target — `PAGES_TARGET=pages`, which flips `output` to 'static' and sets
# `base: '/GeminiTTS/'` — and uploads `dist/client`. The `prerender = false`
# API routes are still emitted into `dist/server`; they are simply not uploaded,
# because there is nothing on Pages that can execute them. What the demo runs is
# the BYOK path, where the browser talks to Google with the visitor's own key
# and no server secret is involved at any point.
#
# The node deployment is untouched: `bun run build && bun run start` is still
# `output: 'server'` and is the complete product.
name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never deploy a stale build over a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # JOB-LEVEL, and this is load-bearing.
    #
    # `PAGES_TARGET` used to be set on the build step alone. That published a
    # site with no HTML in it: the pages were prerendered, then `check:panel`
    # ran two of its own `bun run build` invocations for the positive control,
    # inherited an environment with no `PAGES_TARGET` in it, and silently
    # replaced the artifact with a NODE build — whose `dist/client` holds the
    # hashed assets and none of the prerendered pages. The upload step then
    # shipped 14 files and zero `.html`, and the run still reported success.
    # Every step in this job must build the same target, so the variable is set
    # where all of them can see it.
    env:
      PAGES_TARGET: pages
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No `GEMINI_API_KEY` here, and none is wanted: the static build must not
      # depend on a secret it does not use. `src/env.d.ts` types the variable
      # optional for exactly this reason.
      - name: Build the static site
        run: bun run build

      - name: Type check
        run: bun run check

      # The panel is a DOM script, so `astro check` and `bun test` cannot see it.
      # This is the only thing standing between a user and a permanently
      # disabled Generate button, so it runs in CI rather than by hand.
      - name: Cost gate
        run: bun run check:panel

      # The net under the whole job. `check:panel` rebuilds the project, so any
      # step that ends up building the wrong target replaces the artifact this
      # upload depends on — and a static deploy of a node build is not a build
      # failure, it is a successful upload of a site with no pages in it. That
      # is exactly what happened, and it shipped as a green run.
      - name: Assert the static output survived
        run: |
          for page in dist/client/index.html dist/client/text-to-speech/index.html dist/client/speech-to-text/index.html; do
            if [ ! -f "$page" ]; then
              echo "::error::$page is missing. Something rebuilt the node target over the static one."
              exit 1
            fi
          done
          echo "all three pages are present in dist/client"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # `dist/client` is the static site. Uploading `dist` would publish the
          # server bundle's contents as if they were web assets.
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
